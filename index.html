<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCare Clinic Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7fb;
            color: #333;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.9;
        }

        nav {
            background-color: white;
            padding: 15px 40px;
            border-bottom: 1px solid #ddd;
        }

        nav a {
            margin-right: 25px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .section-title {
            margin-bottom: 20px;
        }

        .form-container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .form-container h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .full-width {
            grid-column: span 2;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background-color: #2563eb;
            color: white;
            margin-top: 20px;
        }

        .add-btn:hover {
            background-color: #1d4ed8;
        }

        .cancel-btn {
            background-color: #777;
            color: white;
            margin-top: 20px;
            margin-left: 5px;
            display: none;
        }

        .table-container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #2563eb;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .edit-btn {
            background-color: #f59e0b;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background-color: #dc2626;
            color: white;
        }

        .edit-btn:hover {
            background-color: #d97706;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }

            header {
                padding: 20px;
            }

            nav {
                padding: 15px 20px;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>🏥 MediCare Clinic</h1>
        <p>Clinic Management System</p>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <a href="#">Patients</a>
        <a href="#">Doctors</a>
        <a href="#">Appointments</a>
    </nav>

    <div class="container">

        <!-- PATIENT FORM -->
        <div class="form-container">

            <h2 id="formTitle">Add New Patient</h2>

            <form id="patientForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">Patient Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter patient name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input
                            type="number"
                            id="age"
                            placeholder="Enter age"
                            min="1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="contact">Contact Number</label>
                        <input
                            type="text"
                            id="contact"
                            placeholder="Enter contact number"
                            required
                        >
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Address</label>
                        <input
                            type="text"
                            id="address"
                            placeholder="Enter patient address"
                        >
                    </div>

                </div>

                <button type="submit" class="add-btn" id="submitBtn">
                    Add Patient
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

                <p class="message" id="message"></p>

            </form>

        </div>


        <!-- PATIENT TABLE -->
        <div class="table-container">

            <h2 class="section-title">Patient Records</h2>

            <button onclick="loadPatients()" class="add-btn">
                Refresh Patients
            </button>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Contact</th>
                        <th>Address</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="patientTableBody">
                    <!-- Patients will appear here -->
                </tbody>

            </table>

        </div>

    </div>


    <script>

        const patientForm = document.getElementById("patientForm");
        const patientTableBody = document.getElementById("patientTableBody");

        const nameInput = document.getElementById("name");
        const ageInput = document.getElementById("age");
        const genderInput = document.getElementById("gender");
        const contactInput = document.getElementById("contact");
        const addressInput = document.getElementById("address");

        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const formTitle = document.getElementById("formTitle");
        const message = document.getElementById("message");

        let editingPatientId = null;


        // =========================
        // LOAD PATIENTS
        // =========================

        async function loadPatients() {

            try {

                const response = await fetch("/api/patients");

                const patients = await response.json();

                patientTableBody.innerHTML = "";

                patients.forEach(patient => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${patient.id}</td>
                        <td>${patient.name}</td>
                        <td>${patient.age}</td>
                        <td>${patient.gender}</td>
                        <td>${patient.contact}</td>
                        <td>${patient.address || ""}</td>

                        <td>
                            <button
                                class="edit-btn"
                                onclick="editPatient(${patient.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deletePatient(${patient.id})"
                            >
                                Delete
                            </button>
                        </td>
                    `;

                    patientTableBody.appendChild(row);

                });

            } catch (error) {

                console.error(error);

                message.textContent = "Failed to load patients.";
                message.style.color = "red";

            }
        }


        // =========================
        // ADD / UPDATE PATIENT
        // =========================

        patientForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const patient = {

                name: nameInput.value,
                age: ageInput.value,
                gender: genderInput.value,
                contact: contactInput.value,
                address: addressInput.value

            };


            try {

                let response;

                // UPDATE
                if (editingPatientId !== null) {

                    response = await fetch(
                        `/api/patients/${editingPatientId}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(patient)
                        }
                    );

                }

                // CREATE
                else {

                    response = await fetch(
                        "/api/patients",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(patient)
                        }
                    );

                }


                const result = await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message || "Something went wrong."
                    );

                }


                if (editingPatientId !== null) {

                    message.textContent = "Patient updated successfully.";
                    message.style.color = "green";

                } else {

                    message.textContent = "Patient added successfully.";
                    message.style.color = "green";

                }


                cancelEdit();

                loadPatients();


            } catch (error) {

                console.error(error);

                message.textContent = error.message;
                message.style.color = "red";

            }

        });


        // =========================
        // EDIT PATIENT
        // =========================

        async function editPatient(id) {

            try {

                const response = await fetch("/api/patients");

                const patients = await response.json();

                const patient = patients.find(
                    patient => patient.id === id
                );


                if (!patient) {

                    alert("Patient not found.");

                    return;

                }


                nameInput.value = patient.name;
                ageInput.value = patient.age;
                genderInput.value = patient.gender;
                contactInput.value = patient.contact;
                addressInput.value = patient.address || "";


                editingPatientId = id;

                formTitle.textContent = "Edit Patient";

                submitBtn.textContent = "Update Patient";

                cancelBtn.style.display = "inline-block";


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            } catch (error) {

                console.error(error);

                alert("Failed to load patient.");

            }

        }


        // =========================
        // DELETE PATIENT
        // =========================

        async function deletePatient(id) {

            const confirmed = confirm(
                "Are you sure you want to delete this patient?"
            );


            if (!confirmed) {
                return;
            }


            try {

                const response = await fetch(
                    `/api/patients/${id}`,
                    {
                        method: "DELETE"
                    }
                );


                const result = await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message || "Failed to delete patient."
                    );

                }


                message.textContent = "Patient deleted successfully.";
                message.style.color = "green";


                loadPatients();


            } catch (error) {

                console.error(error);

                message.textContent = error.message;
                message.style.color = "red";

            }

        }


        // =========================
        // CANCEL EDIT
        // =========================

        function cancelEdit() {

            editingPatientId = null;

            patientForm.reset();

            formTitle.textContent = "Add New Patient";

            submitBtn.textContent = "Add Patient";

            cancelBtn.style.display = "none";

        }


        // =========================
        // LOAD PATIENTS ON PAGE LOAD
        // =========================

        loadPatients();

    </script>

</body>
</html>
